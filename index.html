<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Connole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }

    .links a {
      color: #111;
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px solid #ccc;
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    .links a:hover {
      border-color: #111;
    }
  </style>
</head>
<body>
  <main>
    <h1>Tom Connole</h1>
    <p>Software Engineer</p>
    <div class="links">
      <a href="https://github.com/tomcnle">GitHub</a>
    </div>
  </main>
</body>
</html>
